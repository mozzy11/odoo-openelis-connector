services:
## OpenELIS Serivices
  certs:
    container_name: oe-certs
    image: itechuw/certgen:main
    platform: linux/amd64
    restart: always
    environment:
      - KEYSTORE_PW="kspass"
      - TRUSTSTORE_PW="tspass"
    networks:
      - hie
    volumes:
      -  key_trust-store-volume:/etc/openelis-global
      -  keys-vol:/etc/ssl/private/
      -  certs-vol:/etc/ssl/certs/

  db.openelis.org:
    container_name: openelisglobal-database
    image: itechuw/openelis-global-2-database:develop
    platform: linux/amd64
    ports:
      - "15432:5432"
    restart: always
    env_file:
      - ./configs/openelis/database/database.env
    volumes:
      # preserves the database between containers
      - ./configs/openelis/database/data:/var/lib/postgresql/data
    environment:
      - DB_PASSWORD=${OE_DB_PASSWORD}
      - DB_SUPERUSER_PASSWORD=${ADMIN_PASSWORD}  
    networks:
      - hie
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "clinlims", "-U", "clinlims" ]
      timeout: 45s
      interval: 10s
      retries: 10

  oe.openelis.org:
    container_name: openelisglobal-webapp
    image: itechuw/openelis-global-2:develop 
    platform: linux/amd64  
    depends_on:
      odoo.openelis.org:
        condition: service_started
      db.openelis.org:
        condition: service_healthy
      certs:
        condition: service_started
    ports:
      - "8080:8080"
      - "8443:8443"
    restart: always
    networks:
      hie:
        ipv4_address: 172.20.1.121

    environment:
      - DEFAULT_PW=adminADMIN! 
      - TZ=America/New_York
        # Config variables loaded through Tomacat server.xml
      - CATALINA_OPTS= -Ddatasource.url=jdbc:postgresql://db.openelis.org:5432/clinlims -Ddatasource.username=clinlims -Ddatasource.password=${OE_DB_PASSWORD} -Doe.ssl.truststorepath=${SSL_TRUSTSTORE_PATH} -Doe.ssl.truststorepassword=${SSL_TRUSTSTORE_PASSWORD} -Doe.ssl.keystorepath=${SSL_KEYSTORE_PATH} -Doe.ssl.keystorepassword=${SSL_KEYSTORE_PASSWORD}
        # Env variables passed to the common properties file
      - SSL_KEYSTORE_PATH
      - SSL_KEYSTORE_PASSWORD
      - SSL_TRUSTSTORE_PATH
      - SSL_TRUSTSTORE_PASSWORD
    volumes:
      -  key_trust-store-volume:/etc/openelis-global
      -  lucene_index-vol:/var/lib/lucene_index
      - ./tools/dockerize:/dockerize:ro
      - ./configs/openelis/plugins/:/var/lib/openelis-global/plugins
      - ./configs/openelis/logs/oeLogs:/var/lib/openelis-global/logs
      - ./configs/openelis/logs/tomcatLogs/:/usr/local/tomcat/logs
      - ./configs/openelis/properties/SystemConfiguration.properties:/var/lib/openelis-global/properties/SystemConfiguration.properties
      - ./configs/openelis/test-map/test-loinc-map.csv:/var/lib/openelis-global/plugin-test-mappings/test-loinc-map.csv
      - ./configs/openelis/odoo/odoo-test-product-mapping.csv:/var/lib/openelis-global/odoo/odoo-test-product-mapping.csv
      - ./configs/openelis/analyzer/analyzer-test-map.csv:/var/lib/openelis-global/analyzer/analyzer-test-map.csv
    secrets:
      - source: common.properties

  fhir.openelis.org:
    container_name: external-fhir-api
    image: itechuw/openelis-global-2-fhir:develop
    platform: linux/amd64
    depends_on:
      - db.openelis.org
      - certs
    ports:
      - "8081:8080"
      - "8444:8443"
    networks:
      - hie
    restart: always
    environment:
      TZ: America/New_York

      JAVA_OPTS: "-Djavax.net.ssl.trustStore=${SSL_TRUSTSTORE_PATH}
                  -Djavax.net.ssl.trustStorePassword=${SSL_TRUSTSTORE_PASSWORD}
                  -Djavax.net.ssl.trustStoreType=pkcs12
                  -Djavax.net.ssl.keyStore=${SSL_KEYSTORE_PATH}
                  -Djavax.net.ssl.keyStorePassword=${SSL_KEYSTORE_PASSWORD}
                  -Djavax.net.ssl.keyStoreType=pkcs12"
      # Config variables loaded through Tomacat server.xml            
      CATALINA_OPTS: "-Dhapi.ssl.truststorepath=${SSL_TRUSTSTORE_PATH} -Dhapi.ssl.truststorepassword=${SSL_TRUSTSTORE_PASSWORD} -Dhapi.ssl.keystorepath=${SSL_KEYSTORE_PATH} -Dhapi.ssl.keystorepassword=${SSL_KEYSTORE_PASSWORD}"  
      # Config variables loaded through Hapi application.yml
      FHIR_DATASOURCE_URL : "jdbc:postgresql://db.openelis.org:5432/clinlims?currentSchema=clinlims"
      FHIR_DATASOURCE_USERNAME: "clinlims"
      FHIR_DATASOURCE_PASSWORD: ${OE_DB_PASSWORD}
      FHIR_SERVER_ADRESS: "http://fhir.openelis.org:8080/fhir/"

    volumes:
      -  key_trust-store-volume:/etc/openelis-global

  frontend.openelis.org:
    image: itechuw/openelis-global-2-frontend:develop
    platform: linux/amd64
    container_name: openelisglobal-front-end
    networks:
      - hie

  proxy:
    image: itechuw/openelis-global-2-proxy:develop
    container_name: openelisglobal-proxy
    platform: linux/amd64
    ports:
      - 80:80
      - 443:443
    volumes:
      - certs-vol:/etc/nginx/certs/
      - keys-vol:/etc/nginx/keys/
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - hie
    restart: unless-stopped
    depends_on:
      - certs


##ODOO Serivices
  odoo.openelis.org:
    container_name: odoo.openelis.org
    image: odoo:17
    depends_on:
      - db
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      - INITIALIZER_DATA_FILES_PATH=/mnt/odoo_config
      - INITIALIZER_CONFIG_FILE_PATH=/mnt/odoo_config/initializer_config.json
      - INITIALIZER_CHECKSUMS_PATH=/var/lib/odoo/checksums
    volumes:
      - ./configs/odoo/addons:/mnt/extra-addons
      - ./configs/odoo/initializer_config:/mnt/odoo_config
      - odoo-openelis-data:/var/lib/odoo
      - ./configs/odoo/config:/etc/odoo
    command: >
      odoo -d postgres
      -i base,base_import,sale_management,stock,account_account,purchase,mrp,odoo_initializer,mrp_product_expiry,product_expiry,l10n_generic_coa
      --db_user=odoo
      --db_password=odoo
      --db_host=db
    networks:
      - hie
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8069 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  db:
    container_name: odoo.db.openelis.org
    image: postgres:13
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
    volumes:
      - odoo-openelis-db-data:/var/lib/postgresql/data
    networks:
      - hie
    restart: unless-stopped

  odoo.initializer.openelis.org:
    container_name: odoo.initializer.openelis.org
    image: odoo:17
    depends_on:
      odoo.openelis.org:
        condition: service_healthy
    volumes:
      - ./configs/odoo/addons:/mnt/extra-addons
      - ./configs/odoo/initializer_config:/mnt/odoo_config
      - odoo-openelis-data:/var/lib/odoo
      - ./configs/odoo/config:/etc/odoo
      - ./test_initializer_fixed.py:/tmp/test_initializer_fixed.py
    command: >
      sh -c "
      echo 'Waiting for Odoo to be ready...' &&
      sleep 60 &&
      echo 'Running initializer...' &&
      python3 /tmp/test_initializer_fixed.py &&
      echo 'Initialization completed!'
      "
    networks:
      - hie
    restart: "no"

secrets:
    common.properties:
      file: ./configs/openelis/properties/common.properties

networks:
  hie:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24

volumes:
  key_trust-store-volume:
  certs-vol:
  certs:
  keys-vol:
  lucene_index-vol:
  odoo-openelis-data:
  odoo-openelis-db-data:
